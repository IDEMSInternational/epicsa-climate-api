name: Run Pytest

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ vars.GCP_CONTAINER_REPO }}/${{ vars.GCP_SERVICE }}:${{github.sha}}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up app environment
      run: |
        cp .env.sample .env

    - name: Build container image
      uses: docker/build-push-action@v5
      with:
        cache-from: type=gha
        cache-to: type=gha, mode=max
        load: true
        tags: ${{ env.IMAGE_TAG }}

    - name: Decode and prepare PostgreSQL secret
      if: secrets.POSTGRES_SECRET_JSON_B64 != ''
      run: |
        echo "${{ secrets.POSTGRES_SECRET_JSON_B64 }}" | base64 -d > postgres-secret.json

    - name: Run tests
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        POSTGRES_SECRET_JSON_B64: ${{ secrets.POSTGRES_SECRET_JSON_B64 }}
      run: |
        docker compose -f docker-compose.yaml -f docker-compose.test.yaml run app pytest -v
